# 站点配置 —— <项目名>(**测试机形态**:http + IP + releases/current,生成即可部署)。
#
# 上主站时逐条改回生产形态(对照 deploy/nginx.conf.example):
#   ① listen 80 / server_name 测试机 IP —— 生产换 443 + 证书 + www.zost.cn;
#   ② 产物路径 current 软链(/srv/zost/<项目名>/current)—— 版本化原子切换,
#      生产沿用 releases 布局则不用改,只改 ①;
#   ③ /api 反代到 edge 网络的 api:8080(测试期同域反代,与 dev 同构)——
#      生产按 A7 换成直连 api.zost.cn(VITE_API_BASE_URL 同步换),删本段;
#   ④ 不发 HSTS(http 下无意义)—— 上 TLS 后加回。
#
# ⚠️ 子路径部署三件套(脚手架已参数化,改动时对照着改):
#    vite base / router 历史 / 下面 location 的 /<项目名>/ 必须一致;SPA 未命中回 index.html。
# ⚠️ 应用端口只 bind 127.0.0.1(F6)——nginx 是唯一对外入口,CSP/限流才拦得住。

server {
    listen 80;
    server_name 43.153.213.190; # 测试服务器;换服务器改这里

    # 构建产物所在目录:current → releases/<版本>(CI 原子软链,回滚=软链拨回)
    root /srv/zost/<项目名>/current;

    # ---- 安全响应头(B10:由 nginx 发,不用 meta 标签)----
    # OSS 域要在**三条** directive 里放行(new-files 直传验收实测,缺一条踩一个):
    #   connect-src = PostObject 直传 XHR;media-src = 音视频预览;frame-src = PDF iframe。
    #   img-src 本来就有 https:,script/style **刻意不放** —— 可执行类型被挡正是白名单的意义。
    #   (域与 OssProperties.urlPrefix 一致;换桶改这里。)
    # 同域反代只需 connect-src 的 'self';生产直连 api.zost.cn 再加回它。
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' https://zost.oss-cn-chengdu.aliyuncs.com; frame-src 'self' https://zost.oss-cn-chengdu.aliyuncs.com; connect-src 'self' https://zost.oss-cn-chengdu.aliyuncs.com;" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; # 上 TLS 后启用

    # ---- 根路径直接进项目(B10 铁律不许资源路径用相对路径,301 成绝对)----
    location = / {
        return 301 /<项目名>/;
    }

    location = /<项目名> {
        return 301 /<项目名>/;
    }

    # ---- 静态资源(带 hash 的可长缓存;index.html 不缓存)----
    location /<项目名>/assets/ {
        alias /srv/zost/<项目名>/current/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- SPA 回退(未命中路径全部回 index.html,否则刷新 404)----
    location /<项目名>/ {
        alias /srv/zost/<项目名>/current/;
        try_files $uri $uri/ /<项目名>/index.html;
    }

    # ---- API 同域反代(CSRF cookie 是 SameSite=lax,同站才带)----
    # resolver + 变量 proxy_pass = **运行时**解析:字面量会在 nginx 重载那一刻查 DNS,
    # 服务器重启时 api 容器还没起来 → nginx 直接起不来(顺序耦合,实测设计)。
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off; # docker 内置 DNS
        set $api_backend http://api:8080; # api 是 compose 服务名,edge 网络上的别名
        proxy_pass $api_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr; # **覆盖**不是追加 ——
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 后端 ClientIp 只读 X-Real-IP(F2):v1 取 XFF 第一个值可被客户端伪造
        # limit_req 是第一层限流(F1),应用里的 RateLimitFilter 是第二层,两层都要(上主站时配)
    }
}
