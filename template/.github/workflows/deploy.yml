# 前端 CI + 部署。
#
#   ① 站点由**共享 nginx 容器**托管(全机唯一占 80 端口,edge 网络反代 api:8080)——
#      本流水线连带部署站点 conf:先 `docker exec nginx nginx -t`,失败即还原,不动线上。
#   ② 构建必须显式 VITE_API_BASE_URL(空值直接 throw)——
#      测试机是同域反代 → 填服务器 IP(与页面同源,cookie/CSRF 走 /api/ 同 dev)。
#
# 需要的 GitHub secrets(**全生态同值,一个仓库配一次即可**):
#   SSH_PRIVATE_KEY(部署专用私钥)/ SSH_KNOWN_HOSTS(ssh-keyscan 的服务器公钥)
#   API_REPO_TOKEN(fine-grained PAT,Contents:Read,只授 zostcn/api —— 拉 spec 快照)
# 服务器一次性准备(共享 nginx)见 /srv/docker-app/nginx/docker-compose.yml 头注释。
#
# 全部单条 ssh + 本地展开变量,不用 heredoc —— heredoc 展开时反引号会被
# 本地执行,登录壳还会吞掉退出码;变量先在本地拼好再送远端,两类坑都绕开。

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: true

env:
  # ============================================================
  # 项目配置:换项目/换服务器只改这里 ↓
  # ============================================================
  DEPLOY_HOST: 43.153.213.190 # 测试服务器(腾讯云轻量);迁主服务器改 IP
  DEPLOY_USER: ubuntu
  PROJECT: <项目名> # → /srv/zost/<PROJECT>/
  NODE_VERSION: "22" # 模板要求 ≥22.12(volta 钉 22.18)
  RELEASE_KEEP: 3 # 服务器保留的历史版本数(>=1)
  # ============================================================

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 生成物不进仓库 —— 构建期从快照现生成。
      # spec 取 api 仓 docs/openapi.json 跨仓 raw 下载,不打运行中的后端
      #(springdoc 只在 dev profile 开,切 prod 即挂);快照新鲜度由 api 仓 CI 闸保证。
      - name: Fetch spec snapshot & generate API client
        env:
          API_REPO_TOKEN: ${{ secrets.API_REPO_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $API_REPO_TOKEN" \
            -H "Accept: application/vnd.github.raw" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/zostcn/api/contents/docs/openapi.json \
            -o openapi.json \
          || { echo "::error::取 api 仓快照失败 —— 检查 secrets.API_REPO_TOKEN(fine-grained PAT,Contents:Read,只授 zostcn/api)与该文件是否已提交"; exit 1; }
          OPENAPI_SPEC="$PWD/openapi.json" npm run gen

      - name: Test
        run: npm test

      # vue-tsc 类型检查在 build 里(build = typecheck + vite build)
      - name: Build
        run: npm run build
        env:
          # 同域反代:与页面同源,axios 直接打 /api/(生产必须显式给值,留空构建失败)
          VITE_API_BASE_URL: http://${{ env.DEPLOY_HOST }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server host key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy (versioned releases + conf 校验后热加载)
        run: |
          set -euo pipefail
          VERSION="$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          APP_DIR="/srv/zost/$PROJECT"
          RELEASE="$APP_DIR/releases/$VERSION"
          TARGET="$DEPLOY_USER@$DEPLOY_HOST"

          # 1. 远端建目录并上传产物
          ssh -o BatchMode=yes "$TARGET" "mkdir -p '$RELEASE' '$APP_DIR/conf'"
          rsync -az -e "ssh -o BatchMode=yes" dist/ "$TARGET:$RELEASE/"

          # 2. 切换前校验产物
          ssh -o BatchMode=yes "$TARGET" \
            "test -f '$RELEASE/index.html' || { echo 'ERROR: 缺少 index.html'; exit 1; }"

          # 3. 站点 conf:先备份 → 覆盖 → 容器内 nginx -t → 不过就还原(线上不受影响)
          ssh -o BatchMode=yes "$TARGET" \
            "test -f '$APP_DIR/conf/$PROJECT.conf' && cp '$APP_DIR/conf/$PROJECT.conf' '$APP_DIR/conf/.$PROJECT.conf.prev'; true"
          rsync -az -e "ssh -o BatchMode=yes" deploy/nginx.conf "$TARGET:$APP_DIR/conf/$PROJECT.conf"
          ssh -o BatchMode=yes "$TARGET" \
            "docker exec nginx nginx -t || { if [ -f '$APP_DIR/conf/.$PROJECT.conf.prev' ]; then mv '$APP_DIR/conf/.$PROJECT.conf.prev' '$APP_DIR/conf/$PROJECT.conf'; else rm -f '$APP_DIR/conf/$PROJECT.conf'; fi; echo 'ERROR: nginx -t 未通过,conf 已还原'; exit 1; }"

          # 4. 热加载 conf(优雅重载,不断连接)
          ssh -o BatchMode=yes "$TARGET" "docker exec nginx nginx -s reload"

          # 5. 原子切换 current(软链拨过去即生效)
          ssh -o BatchMode=yes "$TARGET" "ln -sfn 'releases/$VERSION' '$APP_DIR/current'"

          # 6. 清理旧版本(时间戳-短sha 字典序即时间序;.prev 每次部署覆盖不累积)
          ssh -o BatchMode=yes "$TARGET" \
            "cd '$APP_DIR/releases' && ls -1 | sort | head -n -$RELEASE_KEEP | xargs -r rm -rf --"

          echo "deployed $VERSION"
