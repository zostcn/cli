# 站点配置 —— <项目名>(**测试机形态**:http + IP,完整 server 块,生成即可部署)。
#
# 上主站时整体换成路径片段(对照 deploy/nginx.conf.example):生产机已有
# zost.cn 主块(人工全权,server 级安全头 + TLS),CI 只交
# location 片段落 /srv/zost/<项目名>/loc/ —— 本文件的 server 级内容全部随之删除。
#
# ⚠️ 子路径三件套:vite base / router 历史 / 下面 location 的 /<项目名>/ 必须一致
#    (router 用 import.meta.env.BASE_URL,自动跟随 base,不用第二处配置)。
# ⚠️ 不用 alias + try_files:try_files 的检查路径是 alias + **完整 $uri**(不剥
#    location 前缀),检查永远落空、全部请求掉进回退。用 root + 布局对齐:
#    webroot/<项目名> → current(CI 软链),URI /<项目名>/x 正好映到 current/x。
# ⚠️ add_header 不继承:location 里只要有一条 add_header,server 级同类头全部失效
#    —— /assets/ 带了 Cache-Control,就必须自带全套安全头(与 server 级同值);
#    其余 location 不带 add_header,继承 server 级。

server {
    listen 80;
    server_name 43.153.213.190; # 测试服务器;换服务器改这里

    # ---- 安全响应头(由 nginx 发,不用 meta 标签)----
    # OSS 域要在**三条** directive 里放行,缺一条坏一类资源:
    #   connect-src = PostObject 直传 XHR;media-src = 音视频预览;frame-src = PDF iframe。
    #   img-src 本来就有 https:,script/style **刻意不放** —— 可执行类型被挡正是白名单的意义。
    #   (域与 OssProperties.urlPrefix 一致;换桶改这里。)
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' https://zost.oss-cn-chengdu.aliyuncs.com; frame-src 'self' https://zost.oss-cn-chengdu.aliyuncs.com; connect-src 'self' https://zost.oss-cn-chengdu.aliyuncs.com;" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;
    # HSTS 不发(http 下无意义)—— 上 TLS 后随主块启用,片段/本块不再单独加。

    # ---- 根路径 301 进项目(资源路径不用相对路径,301 成绝对)----
    location = / {
        return 301 /<项目名>/;
    }

    location = /<项目名> {
        return 301 /<项目名>/;
    }

    # ---- 静态资源(带 hash 的可长缓存;index.html 不缓存)----
    location /<项目名>/assets/ {
        root /srv/zost/<项目名>/webroot;
        expires 1y;
        # 本行触发 add_header 继承断链 → 下面必须重复 server 级的全套安全头
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' https://zost.oss-cn-chengdu.aliyuncs.com; frame-src 'self' https://zost.oss-cn-chengdu.aliyuncs.com; connect-src 'self' https://zost.oss-cn-chengdu.aliyuncs.com;" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "DENY" always;
    }

    # ---- SPA 回退(未命中路径全部回 index.html,否则刷新 404)----
    location /<项目名>/ {
        root /srv/zost/<项目名>/webroot;
        try_files $uri $uri/ /<项目名>/index.html;
    }
}
